<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="4" />

  <!-- Glowing Emblem Background -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.3" />
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#primaryGrad)" />

  <!-- Calendar / Sphere Motif inside -->
  <!-- Calendar Header Bar -->
  <rect x="136" y="140" width="240" height="48" rx="16" fill="#ffffff" fill-opacity="0.25" />
  <!-- Binder Rings -->
  <rect x="180" y="120" width="24" height="40" rx="12" fill="#ffffff" />
  <rect x="308" y="120" width="24" height="40" rx="12" fill="#ffffff" />

  <!-- Calendar Body Details -->
  <rect x="136" y="208" width="240" height="160" rx="20" fill="#ffffff" fill-opacity="0.95" />

  <!-- Grid of Event Dots -->
  <circle cx="180" cy="256" r="14" fill="#8b5cf6" />
  <circle cx="256" cy="256" r="14" fill="#ec4899" />
  <circle cx="332" cy="256" r="14" fill="#8b5cf6" />
  <circle cx="180" cy="316" r="14" fill="#ec4899" />
  <circle cx="256" cy="316" r="18" fill="#8b5cf6" />
  <circle cx="332" cy="316" r="14" fill="#10b981" />
</svg>
